# Release workflow — F010
#
# 触发方式：
#   1. workflow_dispatch (manual)：手动跑，artifact 上传到 workflow run（不发 Release）
#   2. push tag v* (e.g. v0.1.0-alpha.0)：自动 build + 创建 GitHub Release，artifact 上传到 Release
#
# 矩阵：windows-latest + macOS x64 + macOS arm64 + ubuntu-latest
# Source checks run concurrently in ci/build; publication requires the same SHA.
# Build artifacts survive acceptance failures, so failed acceptance can be rerun.
#
# v0.1.3.1 修复（2026-06-02）：默认 prerelease=false。之前 `prerelease: true` hardcode
# 让 GitHub 主页不显示 Latest release + electron-updater (releaseType: release) 找不到
# 任何 release → F022 自动更新实际从来没工作过。Body 里仍保留 unsigned 警告，用户首次
# 启动看到 OS warning（Gatekeeper / SmartScreen）就够明示了。
# 带 SemVer prerelease 后缀的 tag（例如 -rc.N / -hotfix.N）会自动标记为 prerelease；
# 手动 workflow_dispatch 也可以通过 mark_as_prerelease=true 显式控制。

name: release

on:
  workflow_dispatch:
    inputs:
      mark_as_prerelease:
        description: 'Mark Release as prerelease (rare — only for rc / beta tags)'
        required: false
        default: 'false'
        type: choice
        options: ['true', 'false']
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  actions: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  NODE_OPTIONS: --max-old-space-size=4096

jobs:
  source:
    name: Qualify source SHA
    runs-on: ubuntu-latest
    timeout-minutes: 65
    permissions:
      contents: read
      actions: write # Dispatch missing full checks; never automatically rerun failures.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
      - name: Require complete CI and build for this commit
        run: node scripts/ci-source-gate.mjs qualify
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - uses: actions/upload-artifact@v4
        with:
          name: source-checks
          path: source-checks.json
          overwrite: true
          if-no-files-found: error

  build:
    name: Build installer (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    # Bound hung tests or lingering handles to a failed run with logs.
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          # node-gyp 12.2+ recognizes the VS 2026 (v18) toolchain shipped by
          # windows-latest.
          - os: windows-latest
            build_script: build:win
            unpacked: win-unpacked
          - os: macos-15-intel
            build_script: build:mac:x64
            unpacked: mac
          - os: macos-latest
            build_script: build:mac:arm64
            unpacked: mac-arm64
          - os: ubuntu-latest
            build_script: build:linux
            unpacked: linux-unpacked
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node from .nvmrc
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Linux runtime test dependencies
        if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends fonts-wqy-zenhei xvfb gnome-keyring libsecret-1-0

      - name: Configure npm script-shell (Windows)
        if: runner.os == 'Windows'
        # npm 默认在 Windows 用 cmd.exe 跑 script —— cmd 不展开 `electron/test/*.test.ts`
        # glob，node 收到字面量 '*.test.ts' 报 "Could not find"。把 npm 的 script-shell
        # 改成 bash，让 Git Bash 展 glob（macOS/Linux 默认就是 bash）。
        shell: bash
        run: npm config set script-shell bash

      - name: Prepare Windows sandbox for packaged Shell gate
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          KODAX_HOME: ${{ runner.temp }}/kodax-space-pack-smoke-home/.kodax
        run: >-
          node --input-type=module -e
          "import { setupKodaXSandbox } from '@kodax-ai/kodax/sandbox';
          const result = await setupKodaXSandbox();
          if (!result.ready) throw new Error('Windows sandbox preparation failed: ' + JSON.stringify(result));"

      - name: Build installer
        run: npm run ${{ matrix.build_script }}
        # 不传 GH_TOKEN —— electron-builder 检测到 GH_TOKEN + tag push 会自动开启 GitHub
        # Publisher 创建 draft release 上传 artifact，跟 release job 的 action-gh-release
        # 撞同一 tag 导致 'already_exists' 失败。build script 已加 `-p never` 双保险。
        env:
          KODAX_HOME: ${{ runner.os == 'Windows' && format('{0}/kodax-space-pack-smoke-home/.kodax', runner.temp) || '' }}
          # 关闭 native rebuild 在 CI（keytar 在 v0.1.0 是 optional + memory fallback）
          npm_config_build_from_source: 'false'

      - name: Create Windows zip fallback downloads
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          foreach ($kind in @('Setup', 'Portable')) {
            Get-ChildItem -LiteralPath out -Filter "*$kind-*.exe" | ForEach-Object {
              $zipPath = Join-Path $_.DirectoryName ($_.BaseName + '.zip')
              if (Test-Path -LiteralPath $zipPath) {
                Remove-Item -LiteralPath $zipPath -Force
              }
              Compress-Archive -LiteralPath $_.FullName -DestinationPath $zipPath -CompressionLevel Optimal
              Write-Host "Created $(Split-Path -Leaf $zipPath)"
            }
          }
          Get-ChildItem -LiteralPath out -Filter '*.zip' | Format-Table -AutoSize

      # pack.mjs already performed dependency/boot/exit smokes. Preserve executable
      # permissions and macOS symlinks in a tarball, not loose uploaded files.
      - name: Archive and fingerprint candidate
        shell: bash
        run: |
          tar -czf out/app.tgz -C out "${{ matrix.unpacked }}"
          node scripts/release-candidate.mjs record out "${{ matrix.os }}"

      - name: Upload executable candidate
        uses: actions/upload-artifact@v4
        with:
          name: candidate-${{ matrix.os }}
          path: |
            out/app.tgz
            out/candidate.json
          compression-level: 0
          retention-days: 14
          overwrite: true
          if-no-files-found: error

      - name: Upload installer artifacts
        uses: actions/upload-artifact@v4
        with:
          name: installer-${{ matrix.os }}
          path: |
            out/*.exe
            out/*.dmg
            out/*.AppImage
            out/*.deb
            out/*.zip
            out/*.blockmap
            out/latest*.yml
            out/candidate.json
          compression-level: 0
          retention-days: 30
          overwrite: true
          if-no-files-found: error

      - name: Preserve packaging smoke evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: packaging-smoke-${{ matrix.os }}-${{ github.run_attempt }}
          path: test-results/
          retention-days: 14
          if-no-files-found: ignore

  acceptance:
    name: Packaged acceptance (${{ matrix.os }})
    needs: build
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            executable: 'out/win-unpacked/KodaX Space.exe'
          - os: macos-15-intel
            executable: 'out/mac/KodaX Space.app/Contents/MacOS/KodaX Space'
          - os: macos-latest
            executable: 'out/mac-arm64/KodaX Space.app/Contents/MacOS/KodaX Space'
          - os: ubuntu-latest
            executable: 'out/linux-unpacked/kodax-space'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
      - run: npm ci
      - name: Install Linux runtime test dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends fonts-wqy-zenhei xvfb gnome-keyring libsecret-1-0
      - uses: actions/download-artifact@v4
        with:
          name: candidate-${{ matrix.os }}
          path: out
      - name: Verify and unpack exact candidate
        shell: bash
        run: |
          node scripts/release-candidate.mjs verify out "${{ matrix.os }}"
          tar -xzf out/app.tgz -C out

      - name: Prepare Windows native artifacts
        if: runner.os == 'Windows'
        run: node scripts/test/warm-kodax-native-artifacts.mjs
        env:
          KODAX_HOME: ${{ runner.temp }}/kodax-space-acceptance-warmup/.kodax

      # Exercise each platform's packaged main process, Renderer and Registry SDK.
      # Retries match the main CI policy (playwright.config.ts CI retries=2):
      # loaded-runner races rotate between the slowest runners each round, and
      # Playwright still retains every failed attempt's evidence for flaky
      # tests, while a deterministic failure fails all attempts and stays red.
      - name: Packaged SDK consumer acceptance
        shell: bash
        env:
          SPACE_E2E_EXECUTABLE: ${{ github.workspace }}/${{ matrix.executable }}
        run: |
          specs=(tests/e2e/renderer-boot.spec.ts tests/e2e/sdk-unified-contract.spec.ts tests/e2e/sdk-product-output.spec.ts tests/e2e/sdk-restored-history.spec.ts tests/e2e/shared-host-history-recovery.spec.ts tests/e2e/sdk-migration-gaps.spec.ts)
          if [[ "$RUNNER_OS" == Linux ]]; then
            dbus-run-session -- xvfb-run --auto-servernum --server-args="-screen 0 1280x800x24" bash -euo pipefail -c '
              printf "%s\n" "kodax-space-ci" |
                gnome-keyring-daemon --unlock --components=secrets >/dev/null
              npm run e2e:run -- "$@" --retries=2 --max-failures=1
            ' -- "${specs[@]}"
          else
            npm run e2e:run -- "${specs[@]}" --retries=2 --max-failures=1
          fi

      - name: Record accepted candidate
        uses: actions/upload-artifact@v4
        with:
          name: accepted-${{ matrix.os }}
          path: out/candidate.json
          overwrite: true
          if-no-files-found: error

      - name: Summarize packaged E2E attempts
        if: always()
        run: node scripts/ci-report.mjs

      - name: Upload packaged acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: packaged-sdk-results-${{ matrix.os }}-${{ github.run_attempt }}
          path: |
            test-results/
            playwright-report/
          retention-days: 14
          if-no-files-found: ignore

  release:
    name: Create GitHub Release
    needs: [source, build, acceptance]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node from .nvmrc
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install release tooling
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Download installers
        uses: actions/download-artifact@v4
        with:
          pattern: installer-*
          path: ./artifacts

      - name: Download acceptance receipts
        uses: actions/download-artifact@v4
        with:
          pattern: accepted-*
          path: ./artifacts

      - name: Download source evidence
        uses: actions/download-artifact@v4
        with:
          name: source-checks
          path: ./source-evidence

      - name: Recheck source and accepted installer checksums
        run: |
          node scripts/ci-source-gate.mjs verify source-evidence/source-checks.json
          node scripts/release-candidate.mjs publish artifacts
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Stage release files
        run: |
          node scripts/prepare-release-files.mjs artifacts release "$GITHUB_REF_NAME"

      - name: Generate release notes from changelog
        shell: bash
        run: |
          set -euo pipefail
          git fetch --force --tags --prune >/dev/null 2>&1 || true

          node <<'NODE'
          const fs = require('node:fs');
          const cp = require('node:child_process');

          const tag = process.env.GITHUB_REF_NAME || '';
          const version = tag.replace(/^v/, '');
          const repository = process.env.GITHUB_REPOSITORY || 'KodaX-AI-dev/KodaX-Space';

          if (!/^v?\d+\.\d+\.\d+/.test(tag)) {
            throw new Error(`Unsupported release tag: ${tag}`);
          }

          const escapeRegExp = (value) => value.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
          const changelog = fs.readFileSync('CHANGELOG.md', 'utf8');
          const heading = new RegExp(`^## \\[${escapeRegExp(version)}\\][^\\n]*\\n`, 'm');
          const match = heading.exec(changelog);

          if (!match) {
            throw new Error(`CHANGELOG.md does not contain a section for ${version}`);
          }

          const bodyStart = match.index + match[0].length;
          const remainder = changelog.slice(bodyStart);
          const nextHeading = remainder.search(/^## \[[^\]]+\]/m);
          const releaseChangelog = (nextHeading >= 0 ? remainder.slice(0, nextHeading) : remainder).trim();

          let previousTag = '';
          try {
            const tags = cp
              .execSync('git tag --list "v[0-9]*" --sort=-v:refname', { encoding: 'utf8' })
              .trim()
              .split(/\r?\n/)
              .filter(Boolean);
            const currentIndex = tags.indexOf(tag);
            previousTag = currentIndex >= 0 ? tags[currentIndex + 1] || '' : '';
          } catch {
            previousTag = '';
          }

          const fullChangelog = previousTag
            ? `\n\n**Full Changelog**: https://github.com/${repository}/compare/${previousTag}...${tag}\n`
            : '';

          const notes = [
            `# KodaX Space ${tag}`,
            '',
            releaseChangelog,
            '',
            '---',
            '',
            '## Installation Notes',
            '',
            '> **Unsigned installers:** first launch may trigger OS trust prompts.',
            '',
            '- Windows: use `Setup.exe` for normal install, `Portable.exe` for no-install launch, or the matching `.zip` fallback if the browser blocks direct `.exe` downloads.',
            '- Windows SmartScreen: click "More info" -> "Run anyway"',
            '- macOS: Gatekeeper -> right-click -> Open -> confirm',
            '- Linux: `chmod +x *.AppImage` then run; or `sudo dpkg -i *.deb`',
            '',
            'KodaX Space is a local-first tool for trusted users; installers remain unsigned for this release.',
            '',
            '## Verify Checksums',
            '',
            `SHA-512 checksums are included in the uploaded \`latest*.yml\` electron-updater manifests; GitHub also exposes a SHA-256 digest for each release asset.${fullChangelog}`,
          ].join('\n');

          fs.writeFileSync('release-notes.md', `${notes.trim()}\n`);
          NODE

          sed -n '1,120p' release-notes.md

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          # tag push → SemVer 后缀或手动输入决定 prerelease；Release body 优先展示 CHANGELOG。
          prerelease: ${{ github.event.inputs.mark_as_prerelease == 'true' || contains(github.ref_name, '-') }}
          files: release/*
          body_path: release-notes.md
