name: release
on:
  workflow_dispatch:
    inputs:
      mark_as_prerelease:
        description: Mark Release as prerelease (rare — only for rc / beta tags)
        required: false
        default: "false"
        type: choice
        options:
          - "true"
          - "false"
  push:
    tags:
      - v*
permissions:
  contents: write
env:
  NODE_OPTIONS: --max-old-space-size=4096
jobs:
  build:
    name: Build installer (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            artifact_glob: out/*.dmg
            build_script: build:mac:arm64
            executable: out/mac-arm64/KodaX Space.app/Contents/MacOS/KodaX Space
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node from .nvmrc
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install Linux runtime test dependencies
        if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends
          fonts-wqy-zenhei xvfb gnome-keyring libsecret-1-0
      - name: Build workspace packages
        run: npm run build:packages
      - name: Typecheck (gate before pack)
        run: npm run typecheck
      - name: Lint (gate before pack)
        run: npm run lint
      - name: Configure npm script-shell (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: npm config set script-shell bash
      - name: Focused changed-code tests (full suite passed in 39090294249)
        shell: bash
        run: >
          node --test scripts/test/runtime-test-credential-cleanup.test.mjs

          node --test --import tsx
          apps/desktop/electron/test/runtime-host-adapter.test.ts
      - name: Prepare Windows sandbox for packaged Shell gate
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          KODAX_HOME: ${{ runner.temp }}/kodax-space-pack-smoke-home/.kodax
        run: "node --input-type=module -e \"import { setupKodaXSandbox } from
          '@kodax-ai/kodax/sandbox'; const result = await setupKodaXSandbox();
          if (!result.ready) throw new Error('Windows sandbox preparation
          failed: ' + JSON.stringify(result));\""
      - name: Build installer
        shell: bash
        run: |
          export KODAX_BUILD_TARGET_PLATFORM=darwin
          npm run build:smoke
          node scripts/ensure-sqlite-native.mjs electron
          node scripts/ensure-node-pty-helpers.mjs
          node scripts/prepare-feishu-cli.mjs darwin-arm64
          npx electron-builder -p never --mac --arm64 --dir
        env:
          KODAX_HOME: ${{ runner.os == 'Windows' &&
            format('{0}/kodax-space-pack-smoke-home/.kodax', runner.temp) || ''
            }}
          npm_config_build_from_source: "false"
      - name: Create Windows zip fallback downloads
        if: runner.os == 'Windows'
        shell: pwsh
        run: >
          $ErrorActionPreference = 'Stop'

          foreach ($kind in @('Setup', 'Portable')) {
            Get-ChildItem -LiteralPath out -Filter "*$kind-*.exe" | ForEach-Object {
              $zipPath = Join-Path $_.DirectoryName ($_.BaseName + '.zip')
              if (Test-Path -LiteralPath $zipPath) {
                Remove-Item -LiteralPath $zipPath -Force
              }
              Compress-Archive -LiteralPath $_.FullName -DestinationPath $zipPath -CompressionLevel Optimal
              Write-Host "Created $(Split-Path -Leaf $zipPath)"
            }
          }

          Get-ChildItem -LiteralPath out -Filter '*.zip' | Format-Table
          -AutoSize
      - name: Validate unpacked diagnostic executable (installer qualified separately)
        env:
          KODAX_HOME: ${{ runner.os == 'Windows' &&
            format('{0}/kodax-space-pack-smoke-home/.kodax', runner.temp) || ''
            }}
        shell: bash
        run: test -f '${{ matrix.executable }}'
      - name: Packaged SDK consumer acceptance
        shell: bash
        env:
          E2E_DEBUG: "1"
          SPACE_E2E_EXECUTABLE: ${{ github.workspace }}/${{ matrix.executable }}
        run: >
          set +e

          npm run e2e:run -- tests/e2e/sdk-product-output.spec.ts --grep 'real
          SDK items replace live output' --retries=0 --max-failures=1
          --output=test-results/input

          input_result=$?

          npm run e2e:run -- tests/e2e/sdk-unified-contract.spec.ts --grep
          'Space complete exit protects another' --retries=0 --max-failures=1
          --output=test-results/exit

          exit_result=$?

          echo "Diagnostic results: input=$input_result exit=$exit_result"

          if (( input_result != 0 || exit_result != 0 )); then exit 1; fi
      - name: Upload packaged acceptance failure evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: packaged-sdk-failure-${{ matrix.os }}
          path: |
            test-results/
            playwright-report/
          retention-days: 14
          if-no-files-found: ignore
      - name: Upload installer artifacts (workflow_dispatch path)
        uses: actions/upload-artifact@v4
        with:
          name: installer-${{ matrix.os }}
          path: |
            out/*.exe
            out/*.dmg
            out/*.AppImage
            out/*.deb
            out/*.zip
            out/*.blockmap
            out/latest*.yml
          retention-days: 30
  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node from .nvmrc
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install release tooling
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./artifacts
      - name: Stage release files
        run: >
          node scripts/prepare-release-files.mjs artifacts release
          "$GITHUB_REF_NAME"
      - name: Generate release notes from changelog
        shell: bash
        run: >
          set -euo pipefail

          git fetch --force --tags --prune >/dev/null 2>&1 || true


          node <<'NODE'

          const fs = require('node:fs');

          const cp = require('node:child_process');


          const tag = process.env.GITHUB_REF_NAME || '';

          const version = tag.replace(/^v/, '');

          const repository = process.env.GITHUB_REPOSITORY ||
          'KodaX-AI-dev/KodaX-Space';


          if (!/^v?\d+\.\d+\.\d+/.test(tag)) {
            throw new Error(`Unsupported release tag: ${tag}`);
          }


          const escapeRegExp = (value) => value.replace(/[.*+?^${}()|[\]\\]/g,
          '\\$&');

          const changelog = fs.readFileSync('CHANGELOG.md', 'utf8');

          const heading = new RegExp(`^##
          \\[${escapeRegExp(version)}\\][^\\n]*\\n`, 'm');

          const match = heading.exec(changelog);


          if (!match) {
            throw new Error(`CHANGELOG.md does not contain a section for ${version}`);
          }


          const bodyStart = match.index + match[0].length;

          const remainder = changelog.slice(bodyStart);

          const nextHeading = remainder.search(/^## \[[^\]]+\]/m);

          const releaseChangelog = (nextHeading >= 0 ? remainder.slice(0,
          nextHeading) : remainder).trim();


          let previousTag = '';

          try {
            const tags = cp
              .execSync('git tag --list "v[0-9]*" --sort=-v:refname', { encoding: 'utf8' })
              .trim()
              .split(/\r?\n/)
              .filter(Boolean);
            const currentIndex = tags.indexOf(tag);
            previousTag = currentIndex >= 0 ? tags[currentIndex + 1] || '' : '';
          } catch {
            previousTag = '';
          }


          const fullChangelog = previousTag
            ? `\n\n**Full Changelog**: https://github.com/${repository}/compare/${previousTag}...${tag}\n`
            : '';

          const notes = [
            `# KodaX Space ${tag}`,
            '',
            releaseChangelog,
            '',
            '---',
            '',
            '## Installation Notes',
            '',
            '> **Unsigned installers:** first launch may trigger OS trust prompts.',
            '',
            '- Windows: use `Setup.exe` for normal install, `Portable.exe` for no-install launch, or the matching `.zip` fallback if the browser blocks direct `.exe` downloads.',
            '- Windows SmartScreen: click "More info" -> "Run anyway"',
            '- macOS: Gatekeeper -> right-click -> Open -> confirm',
            '- Linux: `chmod +x *.AppImage` then run; or `sudo dpkg -i *.deb`',
            '',
            'KodaX Space is a local-first tool for trusted users; installers remain unsigned for this release.',
            '',
            '## Verify Checksums',
            '',
            `SHA-512 checksums are included in the uploaded \`latest*.yml\` electron-updater manifests; GitHub also exposes a SHA-256 digest for each release asset.${fullChangelog}`,
          ].join('\n');


          fs.writeFileSync('release-notes.md', `${notes.trim()}\n`);

          NODE


          sed -n '1,120p' release-notes.md
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          prerelease: ${{ github.event.inputs.mark_as_prerelease == 'true' ||
            contains(github.ref_name, '-') }}
          files: release/*
          body_path: release-notes.md
