name: build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  NODE_OPTIONS: --max-old-space-size=4096

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      run_tests: ${{ steps.changes.outputs.run_tests }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
      - id: changes
        run: node scripts/ci-changes.mjs

  lint:
    name: Static checks
    needs: changes
    if: needs.changes.outputs.run_tests == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run lint

  smoke:
    needs: changes
    if: needs.changes.outputs.run_tests == 'true'
    name: Smoke build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    # Bound any hung unit test or lingering post-test handle to a failed run
    # with logs instead of a multi-hour stuck job.
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        # node-gyp 12.2+ recognizes the VS 2026 (v18) toolchain on
        # windows-latest, so the build can track the current runner image.
        os: [windows-latest, macos-latest, macos-15-intel, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node from .nvmrc
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install
        run: npm ci

      - name: Install Unicode PDF font (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends fonts-wqy-zenhei

      - name: Typecheck
        # FEATURE_002+ 起强制——renderer 误用未注册 channel / handler 返回 schema-错配 shape 都被 TS 拦
        run: npm run typecheck

      - name: Configure npm script-shell (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: npm config set script-shell bash

      - name: Unit tests (schema validation, envelope, registry)
        shell: bash
        env:
          SKIP_PTY_TESTS: '1'
        run: npm test

      - name: Build renderer + main
        run: npm run build:renderer && npm run build:main

      - name: Verify outputs
        shell: bash
        run: |
          test -f dist-electron/main.js || (echo "::error::main.js missing" && exit 1)
          test -f dist-electron/preload.js || (echo "::error::preload.js missing" && exit 1)
          test -f dist-electron/partner-source-extraction-worker.js || (echo "::error::partner source extraction worker missing" && exit 1)
          test -f apps/desktop/dist/index.html || (echo "::error::renderer index.html missing" && exit 1)
          echo "all build artifacts present"

      # F010: gen-icon 是 release workflow 的前置；这里只 smoke 验证它不报错
      - name: Verify icon generation script
        run: node scripts/gen-icon.mjs

      - name: Verify packaging hooks
        run: node --check scripts/after-pack-win-rcedit.cjs

  gate:
    name: Build gate
    needs: [changes, lint, smoke]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: node scripts/ci-changes.mjs gate
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
