# CI workflow — runs on every PR + push to main
#
# Separate from release.yml because:
#   - release.yml is triggered by tag push and produces installers (heavy)
#   - ci.yml runs source E2E; build.yml owns source quality checks.
#     They run concurrently for the same commit.
#
# Platform matrix:
#   - windows-latest — most users' deployment platform; Electron + Playwright
#     work natively
#   - ubuntu-latest  — cheapest runner; needs xvfb-run wrapper because Electron
#     requires an X display, even in headless mode
#
# macOS skipped: GitHub macOS runners are slow + Electron e2e on macOS is
# historically the flakiest combo. Build matrix in release.yml still includes
# macOS so we don't lose macOS-specific build coverage.
#
# The Electron suite stays single-worker because multiple app/daemon/keychain
# lifecycles can collide inside one host. CI shards the suite across separate
# runners instead, preserving OS-level isolation while reducing wall-clock time.

name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  NODE_OPTIONS: --max-old-space-size=4096

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      run_tests: ${{ steps.changes.outputs.run_tests }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
      - id: changes
        run: node scripts/ci-changes.mjs

  test:
    needs: changes
    if: needs.changes.outputs.run_tests == 'true'
    name: ${{ matrix.os }} / E2E shard ${{ matrix.shard }}
    runs-on: ${{ matrix.os }}
    # Bound hung tests or lingering handles to a failed run with logs.
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          # node-gyp 12.2+ recognizes the VS 2026 (v18) toolchain shipped by
          # windows-latest.
          - os: windows-latest
            shard: 1/2
            shard_index: 1
          - os: windows-latest
            shard: 2/2
            shard_index: 2
          - os: ubuntu-latest
            shard: 1/2
            shard_index: 1
          - os: ubuntu-latest
            shard: 2/2
            shard_index: 2
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node from .nvmrc
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Linux: Electron e2e needs Xvfb; Unicode PDF tests and production
      # generation need a TrueType CJK font with glyf tables. The shared Coder
      # Runtime also requires a real Secret Service backend for its persistent
      # client identity, so exercise the production keychain boundary instead
      # of weakening it for headless tests.
      - name: Install Linux runtime test dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y xvfb fonts-wqy-zenhei gnome-keyring libsecret-1-0

      - name: Configure npm script-shell (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: npm config set script-shell bash

      # E2E specs require renderer + main bundles to be built first
      - name: Build for e2e
        shell: bash
        run: npm run build:smoke

      - name: Prepare Windows native artifacts
        if: runner.os == 'Windows'
        run: node scripts/test/warm-kodax-native-artifacts.mjs
        env:
          KODAX_HOME: ${{ runner.temp }}/kodax-space-e2e-warmup/.kodax

      - name: Run e2e (Windows)
        if: runner.os == 'Windows'
        shell: bash
        # e2e:run verifies the Electron ABI before launching Playwright.
        run: npm run e2e:run -- --shard=${{ matrix.shard }}

      - name: Run e2e (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          dbus-run-session -- bash -euo pipefail -c '
            xvfb-run --auto-servernum --server-args="-screen 0 1280x800x24" bash -euo pipefail -c "
              printf \"%s\\n\" \"kodax-space-ci\" |
                gnome-keyring-daemon --unlock --components=secrets >/dev/null
              npm run e2e:run -- --shard=${{ matrix.shard }}
            "
          '

      - name: Summarize E2E attempts
        if: always()
        run: node scripts/ci-report.mjs

      # Successful retries are evidence too: retain the JSON report and traces.
      - name: Upload Playwright evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results-${{ matrix.os }}-shard-${{ matrix.shard_index }}-${{ github.run_attempt }}
          path: |
            test-results/
            playwright-report/
          retention-days: 14
          if-no-files-found: ignore

  gate:
    name: CI gate
    needs: [changes, test]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: node scripts/ci-changes.mjs gate
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
